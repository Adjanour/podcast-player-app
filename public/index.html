<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Player - Modern & Minimal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
    <div class="container" id="app">
        <!-- Header -->
        <header class="header">
            <h1 class="logo" id="appTitle">PodPlay</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </header>

        <!-- Add Podcast Section -->
        <section class="add-feed">
            <div class="input-group">
                <input
                    type="url"
                    id="feedUrl"
                    placeholder="Enter podcast RSS feed URL..."
                    aria-label="Podcast RSS feed URL"
                >
                <button id="addFeedBtn" class="btn-primary">Add Podcast</button>
            </div>
            <div class="quick-add" id="quickAddSection">
                <p class="quick-add-label">Try these popular podcasts:</p>
                <div class="quick-links" id="quickLinks">
                    <button class="quick-link" data-feed="https://feeds.simplecast.com/54nAGcIl">The Daily</button>
                    <button class="quick-link" data-feed="https://feeds.megaphone.fm/stuffyoushouldknow">Stuff You Should Know</button>
                    <button class="quick-link" data-feed="https://changelog.com/podcast/feed">The Changelog</button>
                </div>
            </div>
        </section>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Podcast List -->
        <section class="podcasts-section">
            <h2 class="section-title">Your Podcasts</h2>
            <div id="podcastList" class="podcast-list">
                <!-- Podcasts will be dynamically added here -->
            </div>
        </section>

        <!-- Episodes Section -->
        <section class="episodes-section" id="episodesSection" style="display: none;">
            <div class="episodes-header">
                <button id="backBtn" class="btn-back">← Back to Podcasts</button>
                <h2 class="section-title" id="podcastTitle">Episodes</h2>
                <div style="display: flex; gap: 10px; margin-left: auto;">
                    <button id="playlistBtn" class="btn-action" aria-label="Generate playlist">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                    </button>
                    <button id="searchBtn" class="btn-action" aria-label="Search episodes (F key)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="episodesList" class="episodes-list">
                <!-- Episodes will be dynamically added here -->
            </div>
        </section>

        <!-- Sticky Audio Player -->
        <div id="audioPlayer" class="audio-player" style="display: none;">
            <div class="player-info">
                <img id="playerArtwork" src="" alt="Episode artwork" class="player-artwork">
                <div class="player-details">
                    <p class="player-title" id="playerTitle">Episode Title</p>
                    <p class="player-podcast" id="playerPodcast">Podcast Name</p>
                </div>
            </div>

            <div class="player-controls">
                <button id="skipBackBtn" class="control-btn" aria-label="Skip back 15 seconds">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                </button>
                <button id="playPauseBtn" class="control-btn play-pause" aria-label="Play/Pause">
                    <svg id="playPauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </button>
                <button id="skipForwardBtn" class="control-btn" aria-label="Skip forward 15 seconds">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
            </div>

            <div class="player-progress">
                <span id="currentTime" class="time">0:00</span>
                <input
                    type="range"
                    id="progressBar"
                    class="progress-bar"
                    min="0"
                    max="100"
                    value="0"
                    aria-label="Progress bar"
                >
                <span id="duration" class="time">0:00</span>
            </div>

            <div class="player-volume">
                <button id="speedControl" class="speed-btn" aria-label="Playback speed">
                    1x
                </button>
                <button id="sleepTimerBtn" class="sleep-timer-btn" aria-label="Sleep timer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </button>
                <button id="shareBtn" class="share-btn" aria-label="Share">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
                <svg class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <input
                    type="range"
                    id="volumeControl"
                    class="volume-slider"
                    min="0"
                    max="100"
                    value="100"
                    aria-label="Volume control"
                >
            </div>

            <!-- Audio Visualizer Canvas -->
            <canvas id="visualizer" class="visualizer"></canvas>

            <audio id="audio" crossorigin="anonymous"></audio>
        </div>

        <!-- Search Modal (hidden by default) -->
        <div id="searchModal" class="search-modal" style="display: none;">
            <div class="search-content">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search episodes..."
                    aria-label="Search episodes"
                >
                <button id="closeSearch" class="close-search">×</button>
            </div>
        </div>

        <!-- Sleep Timer Modal -->
        <div id="sleepTimerModal" class="modal" style="display: none;">
            <div class="modal-content">
                <h3>Sleep Timer</h3>
                <p class="modal-subtitle">Auto-pause playback after</p>
                <div class="sleep-timer-options">
                    <button class="timer-btn" data-minutes="5">5 min</button>
                    <button class="timer-btn" data-minutes="10">10 min</button>
                    <button class="timer-btn" data-minutes="15">15 min</button>
                    <button class="timer-btn" data-minutes="30">30 min</button>
                    <button class="timer-btn" data-minutes="60">60 min</button>
                </div>
                <div id="timerDisplay" class="timer-display" style="display: none;">
                    <p>Time remaining: <span id="timerCountdown">00:00</span></p>
                    <button id="cancelTimer" class="btn-secondary">Cancel Timer</button>
                </div>
                <button id="closeSleepTimer" class="close-modal">×</button>
            </div>
        </div>

        <!-- Share Modal -->
        <div id="shareModal" class="modal" style="display: none;">
            <div class="modal-content share-content">
                <h3>Share Episode</h3>
                <div id="sharePreview" class="share-preview">
                    <!-- Preview card will be generated here -->
                </div>
                <div class="share-buttons">
                    <button id="copyShareLink" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copy Link
                    </button>
                    <button id="shareTwitter" class="btn-social twitter">
                        Share on X
                    </button>
                </div>
                <button id="closeShare" class="close-modal">×</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
